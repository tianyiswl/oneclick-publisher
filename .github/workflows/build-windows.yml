name: 构建 Windows 客户端

on:
  workflow_dispatch:
    inputs:
      build_date:
        description: 构建日期（YYYYMMDD，留空则使用 Runner 当天日期）
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Windows x64 构建
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-oneclick.txt

      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-oneclick.txt PyInstaller==6.21.0

      - name: 验证 Windows 源码离屏界面
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "oneclick-source-ui-test.stdout"
          $stderr = Join-Path $env:RUNNER_TEMP "oneclick-source-ui-test.stderr"
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -FilePath "python" -ArgumentList @("desktop_native_app.py", "--ui-test") -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "源码离屏界面自检在 30 秒内未退出"
          }
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if ($process.ExitCode -ne 0) {
            throw "源码离屏界面自检失败，退出码：$($process.ExitCode)"
          }
          if (-not (Select-String -Path $stdout -SimpleMatch "NATIVE_DESKTOP_UI_OK" -Quiet)) {
            throw "源码离屏界面自检未输出成功标识"
          }

      - name: 安装内置 Chromium
        run: python -m playwright install chromium

      - name: 构建 Windows x64 客户端
        shell: pwsh
        run: |
          $buildDate = '${{ inputs.build_date }}'.Trim()
          if ([string]::IsNullOrWhiteSpace($buildDate)) {
            python tools/build_windows.py
          } else {
            python tools/build_windows.py --date $buildDate
          }

      - name: 上传 Windows 客户端
        uses: actions/upload-artifact@v4
        with:
          name: 一键发-Windows-x64-${{ github.run_number }}
          path: |
            release/YiJianFa_*_Windows_x64_*.zip
            release/YiJianFa_*_Windows_x64_*.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: 写入构建摘要
        if: success()
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/YiJianFa_*_Windows_x64_*.zip | Select-Object -First 1
          $sha = Get-Content "$($zip.FullName).sha256"
          Add-Content $env:GITHUB_STEP_SUMMARY "## 一键发 Windows x64 构建"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "- 文件：$($zip.Name)"
          Add-Content $env:GITHUB_STEP_SUMMARY "- 校验：``$sha``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- 分发：GitHub Actions Artifact，保留 30 天"
